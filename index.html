<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>SlayerNode Panel v1.0.0 — Game Server Management</title>
    <meta name="title" content="SlayerNode Panel v1.0.0 — Game Server Management" />
    <meta name="description" content="SlayerNode high-performance game server management panel powered by SlayerWings daemon engine. Real-time WebSocket console, Liquid Glass UI, and external VPS clustering." />
    <meta name="keywords" content="slayernode, slayerwings, game server panel, minecraft hosting, docker game server, liquid glass, server management" />
    <meta name="author" content="SlayerNode (https://slayernode.xyz)" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#111216" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://slayernode.xyz/" />
    <meta property="og:site_name" content="SlayerNode" />
    <meta property="og:title" content="SlayerNode Panel — Game Server Management" />
    <meta property="og:description" content="Production-grade game server management powered by the SlayerWings daemon engine." />
    <meta property="og:image" content="/logo.jpg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://slayernode.xyz/" />
    <meta name="twitter:title" content="SlayerNode Panel" />
    <meta name="twitter:description" content="Next-gen game server control panel powered by SlayerWings." />
    <meta name="twitter:image" content="/logo.jpg" />

    <!-- Favicon & Icons using uploaded SlayerNode logo -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="shortcut icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />

    <!-- Fonts: Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #111216;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Inter', -apple-system, sans-serif;
      }
      .loader-logo {
        width: 72px;
        height: 72px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 0 0 30px rgba(220, 38, 38, 0.4);
        border: 1px solid rgba(220, 38, 38, 0.5);
        animation: pulseLogo 2s infinite ease-in-out;
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(220, 38, 38, 0.3); }
        50% { transform: scale(1.04); box-shadow: 0 0 40px rgba(220, 38, 38, 0.7); }
      }
      .loader-bar {
        width: 140px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 20px;
        position: relative;
      }
      .loader-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: #DC2626;
        border-radius: 4px;
        animation: barSlide 1.2s infinite ease-in-out;
      }
      @keyframes barSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body class="bg-[#111216] text-[#F3F4F6] min-h-screen antialiased selection:bg-red-600/30 selection:text-white overflow-x-hidden">
    <div id="root">
      <div id="initial-loader">
        <img src="/logo.jpg" alt="SlayerNode Logo" class="loader-logo" />
        <div style="margin-top: 16px; font-weight: 800; font-size: 16px; color: #FFFFFF; letter-spacing: -0.02em;">
          SlayerNode Control Panel
        </div>
        <div style="font-size: 12px; color: #9CA3AF; margin-top: 4px;">
          Initializing secure cluster environment...
        </div>
        <div class="loader-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
