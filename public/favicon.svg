<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0d111c" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Glowing Glass Shield/Server Prism -->
  <path d="M32 12 L48 20 V33 C48 43 41 50 32 54 C23 50 16 43 16 33 V20 Z" fill="url(#glassGrad)" filter="url(#glow)"/>
  <!-- Specular inner rim -->
  <path d="M32 14 L46 21 V33 C46 41.5 40 48 32 51.8 C24 48 18 41.5 18 33 V21 Z" stroke="url(#specular)" stroke-width="1" fill="none"/>
  <!-- Central Pulse Core -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" opacity="0.95"/>
  <circle cx="32" cy="32" r="8" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
